<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" role="img" aria-label="An approved passport, a suitcase and a plane flying towards a city skyline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2FA"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1050" fill="url(#bg)"/>

  <!-- sun and clouds -->
  <circle cx="700" cy="170" r="80" fill="#FCD34D" opacity=".75"/>
  <g fill="#ffffff">
    <ellipse cx="200" cy="170" rx="90" ry="34"/><ellipse cx="250" cy="150" rx="60" ry="40"/>
    <ellipse cx="620" cy="330" rx="80" ry="28"/><ellipse cx="660" cy="314" rx="50" ry="32"/>
  </g>

  <!-- skyline -->
  <g fill="#0F4C63" opacity=".9">
    <rect x="40" y="430" width="70" height="170"/>
    <rect x="120" y="380" width="56" height="220"/>
    <!-- clock tower -->
    <rect x="190" y="300" width="50" height="300"/>
    <path d="M190 300l25-60 25 60z"/>
    <rect x="250" y="450" width="90" height="150"/>
    <rect x="350" y="400" width="60" height="200"/>
    <!-- wheel -->
    <rect x="560" y="470" width="120" height="130"/>
    <rect x="690" y="420" width="70" height="180"/>
    <rect x="770" y="460" width="90" height="140"/>
  </g>
  <circle cx="215" cy="345" r="15" fill="#FCD34D"/>
  <g transform="translate(490 470)">
    <circle r="90" fill="none" stroke="#0F4C63" stroke-width="8"/>
    <path d="M0-90V90M-90 0H90M-64-64L64 64M64-64L-64 64" stroke="#0F4C63" stroke-width="4"/>
    <path d="M-20 130L0 0l20 130" fill="none" stroke="#0F4C63" stroke-width="8"/>
  </g>
  <rect x="0" y="600" width="900" height="16" fill="#0F4C63" opacity=".9"/>

  <!-- dotted route and plane -->
  <path d="M80 760C260 640 420 720 560 600S760 380 830 260" fill="none" stroke="#1B5E9E" stroke-width="5" stroke-dasharray="4 16" stroke-linecap="round"/>
  <g transform="translate(800 290) rotate(-42)">
    <path d="M-60 0h100c20 0 30 6 30 12s-10 12-30 12H-60z" fill="#1B5E9E"/>
    <path d="M-10 4l-30-50h22l50 50z" fill="#14607D"/>
    <path d="M-10 20l-30 50h22l50-50z" fill="#14607D"/>
    <path d="M-60 2l-14-26h14l18 26z" fill="#F59E0B"/>
  </g>

  <!-- suitcase -->
  <g transform="translate(560 700)">
    <rect x="70" y="-40" width="80" height="50" rx="16" fill="none" stroke="#0F4C63" stroke-width="12"/>
    <rect x="0" y="0" width="220" height="260" rx="28" fill="#F59E0B"/>
    <rect x="44" y="0" width="16" height="260" fill="#D97706"/>
    <rect x="160" y="0" width="16" height="260" fill="#D97706"/>
    <circle cx="40" cy="276" r="16" fill="#0F4C63"/>
    <circle cx="180" cy="276" r="16" fill="#0F4C63"/>
  </g>

  <!-- passport -->
  <g transform="translate(150 660) rotate(-8)">
    <rect x="0" y="0" width="300" height="400" rx="22" fill="#1B5E9E"/>
    <rect x="16" y="16" width="268" height="368" rx="14" fill="none" stroke="#7FB5E6" stroke-width="3"/>
    <circle cx="150" cy="170" r="70" fill="none" stroke="#F59E0B" stroke-width="7"/>
    <ellipse cx="150" cy="170" rx="30" ry="70" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <line x1="80" y1="170" x2="220" y2="170" stroke="#F59E0B" stroke-width="5"/>
    <text x="150" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#F59E0B">PASSPORT</text>
  </g>

  <!-- approved stamp -->
  <g transform="translate(400 900) rotate(-16)">
    <circle r="92" fill="#ffffff" opacity=".92"/>
    <circle r="86" fill="none" stroke="#10B981" stroke-width="8"/>
    <circle r="68" fill="none" stroke="#10B981" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="2" fill="#10B981">VISA</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#10B981">APPROVED</text>
  </g>

  <g fill="#F59E0B">
    <path d="M90 60l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/>
    <path d="M460 230l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
  </g>
</svg>
